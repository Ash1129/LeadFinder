[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadfinder"
version = "0.1.0"
description = "LeadFinder: an AI lead finder for health-tech sales to independent medical practices (visits, NPI-style enrichment, explainable scores, drafted outreach an SDR approves)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leadfinder = ["service/templates/*.html", "service/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
