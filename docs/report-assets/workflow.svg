<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 524" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="LeadFinder workflow for one lead">
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5E5B55"/></marker>
  </defs>
  <rect width="1120" height="524" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="19" font-weight="700" fill="#201F1D">One lead, one fixed path: AI only where judgment is needed</text>
  <text x="24" y="58" font-size="13" fill="#5E5B55">Nine steps in a fixed order. Code decides what comes next, never an LLM supervisor.</text>

  <!-- row 1 -->
  <rect x="24" y="84" width="192" height="96" rx="8" fill="#EDECE8" stroke="#5E5B55" stroke-dasharray="2 4" stroke-width="1.5"/>
  <text x="38" y="110" font-size="15" font-weight="700" fill="#201F1D">1  Ingest guardrail</text>
  <text x="38" y="132" font-size="12" fill="#201F1D">Code</text>
  <circle cx="44" cy="162" r="5" fill="none" stroke="#5E5B55" stroke-width="1.5"/><text x="56" y="166" font-size="12" fill="#5E5B55">Planned</text>

  <rect x="246" y="84" width="192" height="96" rx="8" fill="#EDECE8" stroke="#5E5B55"/>
  <text x="260" y="110" font-size="15" font-weight="700" fill="#201F1D">2  Visit features</text>
  <text x="260" y="132" font-size="12" fill="#201F1D">Code</text>
  <circle cx="266" cy="162" r="5" fill="#2D6A3E"/><text x="278" y="166" font-size="12" fill="#2D6A3E">Live in demo</text>

  <rect x="468" y="84" width="192" height="96" rx="8" fill="#EDECE8" stroke="#5E5B55"/>
  <text x="482" y="110" font-size="15" font-weight="700" fill="#201F1D">3  Intent gate</text>
  <text x="482" y="132" font-size="12" fill="#201F1D">Code</text>
  <circle cx="488" cy="162" r="5" fill="#2D6A3E"/><text x="500" y="166" font-size="12" fill="#2D6A3E">Live in demo</text>

  <rect x="690" y="84" width="192" height="96" rx="8" fill="#F6EBD9" stroke="#B68235" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="704" y="110" font-size="15" font-weight="700" fill="#201F1D">4  Prospect research</text>
  <text x="704" y="132" font-size="12" fill="#201F1D">Claude agent + 2 tools</text>
  <circle cx="710" cy="162" r="5" fill="#B68235"/><text x="722" y="166" font-size="12" fill="#8A6020">Built, not wired in</text>

  <rect x="912" y="84" width="192" height="96" rx="8" fill="#201F1D"/>
  <text x="926" y="110" font-size="15" font-weight="700" fill="#FFFFFF">5  Lead score</text>
  <text x="926" y="132" font-size="12" fill="#E3E1DC">Trained ML model</text>
  <circle cx="932" cy="162" r="5" fill="#7FC495"/><text x="944" y="166" font-size="12" fill="#BFE3C9">Live in demo</text>

  <!-- row 2 -->
  <rect x="24" y="260" width="192" height="96" rx="8" fill="#F6EBD9" stroke="#B68235" stroke-width="1.5"/>
  <text x="38" y="286" font-size="15" font-weight="700" fill="#201F1D">6  Email + call brief</text>
  <text x="38" y="308" font-size="12" fill="#201F1D">Claude, on request</text>
  <circle cx="44" cy="338" r="5" fill="#2D6A3E"/><text x="56" y="342" font-size="12" fill="#2D6A3E">Live in demo</text>

  <rect x="246" y="260" width="192" height="96" rx="8" fill="#EDECE8" stroke="#5E5B55"/>
  <text x="260" y="286" font-size="15" font-weight="700" fill="#201F1D">7  Check draft</text>
  <text x="260" y="308" font-size="12" fill="#201F1D">Code</text>
  <circle cx="266" cy="338" r="5" fill="#2D6A3E"/><text x="278" y="342" font-size="12" fill="#2D6A3E">Live in demo</text>

  <rect x="468" y="260" width="192" height="96" rx="8" fill="#E0EEE3" stroke="#2D6A3E" stroke-width="1.5"/>
  <text x="482" y="286" font-size="15" font-weight="700" fill="#201F1D">8  SDR approval</text>
  <text x="482" y="308" font-size="12" fill="#201F1D">Person</text>
  <circle cx="488" cy="338" r="5" fill="#2D6A3E"/><text x="500" y="342" font-size="12" fill="#2D6A3E">Live in demo</text>

  <rect x="690" y="260" width="192" height="96" rx="8" fill="#EDECE8" stroke="#5E5B55"/>
  <text x="704" y="286" font-size="15" font-weight="700" fill="#201F1D">9  Send</text>
  <text x="704" y="308" font-size="12" fill="#201F1D">Code (SMTP)</text>
  <circle cx="710" cy="338" r="5" fill="#B68235"/><text x="722" y="342" font-size="12" fill="#8A6020">Test mailbox only</text>

  <!-- gate branches -->
  <rect x="912" y="260" width="192" height="96" rx="8" fill="#F3F2F0" stroke="#E3E1DC"/>
  <text x="926" y="284" font-size="13" font-weight="700" fill="#201F1D">Gate branches (step 3)</text>
  <text x="926" y="304" font-size="12" fill="#201F1D">High intent, practice</text>
  <text x="926" y="320" font-size="12" fill="#201F1D">unknown → SDR review</text>
  <text x="926" y="342" font-size="12" fill="#201F1D">Low intent → stop, logged</text>

  <g fill="none" stroke="#5E5B55" stroke-width="1.4">
    <path d="M216 132H246" marker-end="url(#w)"/>
    <path d="M438 132H468" marker-end="url(#w)"/>
    <path d="M660 132H690" marker-end="url(#w)"/>
    <path d="M882 132H912" marker-end="url(#w)"/>
    <path d="M1008 180V220H120V260" marker-end="url(#w)"/>
    <path d="M216 308H246" marker-end="url(#w)"/>
    <path d="M438 308H468" marker-end="url(#w)"/>
    <path d="M660 308H690" marker-end="url(#w)"/>
  </g>
  <text x="580" y="212" font-size="11" fill="#5E5B55" text-anchor="middle">only a matched practice is scored</text>

  <text x="24" y="398" font-size="13" fill="#201F1D">Loops are bounded: research stops at 10 tool calls; a flagged draft is redrafted at most twice, then goes to a person.</text>
  <text x="24" y="420" font-size="13" fill="#201F1D">No answer from the SDR leaves the lead paused. Nothing is sent without an approval.</text>
  <text x="24" y="442" font-size="13" fill="#201F1D">Before any lead arrives, offline code builds the NPI practice table that step 4 searches and step 5 scores.</text>

  <g font-size="12" fill="#201F1D">
    <rect x="24" y="480" width="16" height="16" rx="3" fill="#EDECE8" stroke="#5E5B55"/><text x="46" y="493">Code / rules</text>
    <rect x="150" y="480" width="16" height="16" rx="3" fill="#201F1D"/><text x="172" y="493">Trained ML model</text>
    <rect x="304" y="480" width="16" height="16" rx="3" fill="#F6EBD9" stroke="#B68235" stroke-width="1.5"/><text x="326" y="493">Claude (LLM)</text>
    <rect x="432" y="480" width="16" height="16" rx="3" fill="#E0EEE3" stroke="#2D6A3E" stroke-width="1.5"/><text x="454" y="493">Person</text>
    <rect x="540" y="480" width="16" height="16" rx="3" fill="none" stroke="#5E5B55" stroke-dasharray="4 3"/><text x="562" y="493">Dashed: built, not wired</text>
    <rect x="730" y="480" width="16" height="16" rx="3" fill="none" stroke="#5E5B55" stroke-dasharray="1 3"/><text x="752" y="493">Dotted: planned</text>
  </g>
</svg>
